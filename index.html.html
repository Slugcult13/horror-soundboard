<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Horror Soundboard & Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0b0b0f;
            color: #ffffff;
            user-select: none;
        }
        
        .font-horror {
            font-family: 'Creepster', cursive;
        }

        /* Mobile Phone Mockup Shadow & Frame */
        .phone-container {
            max-width: 420px;
            box-shadow: 0 0 50px rgba(185, 28, 28, 0.4), 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Glitch & Terror Effects */
        @keyframes flash-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; background-color: rgba(220, 38, 38, 0.5); }
        }

        .screen-flash {
            animation: flash-red 0.2s ease-in-out 2;
        }

        .shake {
            animation: shake-anim 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake-anim {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* Card Hover Effects */
        .horror-card {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            touch-action: manipulation;
        }
        .horror-card:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6 bg-slate-950">

            </div>

            <!-- Quick Ambient Audio Trigger Bar -->
            <div class="w-full max-w-[340px] mt-6 grid grid-cols-2 gap-2">
                <button id="organBtn" class="bg-zinc-900 border border-zinc-700 hover:border-purple-500 active:scale-95 text-zinc-300 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer">

        <!-- Interactive Horror Match Game View -->
        <div id="gameView" class="hidden flex-1 bg-zinc-950 p-4 flex flex-col justify-between items-center text-center">

            <!-- Game Option Buttons -->
            <div id="gameOptions" class="grid grid-cols-2 gap-3 w-full max-w-[340px] my-auto">
                <button data-guess="dracula" class="game-guess-btn bg-zinc-900 border border-zinc-700 active:scale-95 p-3 rounded-lg font-bold text-sm text-red-400 hover:bg-red-950/40 cursor-pointer">Dracula</button>
                <button data-guess="frankenstein" class="game-guess-btn bg-zinc-900 border border-zinc-700 active:scale-95 p-3 rounded-lg font-bold text-sm text-green-400 hover:bg-green-950/40 cursor-pointer">Frankenstein</button>
                <button data-guess="psycho" class="game-guess-btn bg-zinc-900 border border-zinc-700 active:scale-95 p-3 rounded-lg font-bold text-sm text-yellow-400 hover:bg-yellow-950/40 cursor-pointer">Psycho</button>
                <button data-guess="jaws" class="game-guess-btn bg-zinc-900 border border-zinc-700 active:scale-95 p-3 rounded-lg font-bold text-sm text-blue-400 hover:bg-blue-950/40 cursor-pointer">Jaws</button>
            </div>

            <!-- Start / Reset Game Button -->
            <button id="startGameBtn" class="w-full max-w-[340px] bg-red-700 hover:bg-red-600 active:scale-98 text-white font-bold py-3 rounded-lg uppercase tracking-wider shadow-lg transition cursor-pointer select-none">
                Start Sound Match Game
            </button>
        </div>

        <!-- AppInventor Footer -->
        <div class="bg-zinc-900 border-t border-zinc-800 p-2 text-center text-[11px] text-zinc-400 flex justify-around items-center">
            <span class="flex items-center gap-1"><i class="fa-solid fa-volume-high text-xs"></i> Sound Engine Active</span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-mobile-retro text-xs"></i> Haptic FX Ready</span>
        </div>

    </div>

    <script>
        // High-Performance Zero-Latency Pre-Buffered Web Audio Engine
        let audioCtx = null;
        let soundBuffers = {};

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                prebakeSounds();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Synthesize signature audio buffers into memory ahead of time to eliminate initial play latency
        function prebakeSounds() {
            if (Object.keys(soundBuffers).length > 0) return;

            const sampleRate = audioCtx.sampleRate;

            // 1. Dracula: Deep Pipe Organ Minor Chord
            const dracLen = sampleRate * 0.7;
            const dracBuf = audioCtx.createBuffer(1, dracLen, sampleRate);
            const dracData = dracBuf.getChannelData(0);
            const freqs = [130.81, 155.56, 196.00, 261.63]; // C minor
            for (let i = 0; i < dracLen; i++) {
                const t = i / sampleRate;
                const env = Math.exp(-3 * t);
                let wave = 0;
                freqs.forEach(f => {
                    wave += 0.25 * (Math.sin(2 * Math.PI * f * t) + 0.5 * Math.sin(4 * Math.PI * f * t));
                });
                dracData[i] = wave * env;
            }
            soundBuffers.dracula = dracBuf;

            // 2. Frankenstein: Thunderous Crash & Electrical Sub-Bass
            const frankLen = sampleRate * 0.8;
            const frankBuf = audioCtx.createBuffer(1, frankLen, sampleRate);
            const frankData = frankBuf.getChannelData(0);
            for (let i = 0; i < frankLen; i++) {
                const t = i / sampleRate;
                const env = Math.exp(-4 * t);
                const noise = (Math.random() * 2 - 1) * 0.6;
                const sub = Math.sin(2 * Math.PI * 45 * t);
                frankData[i] = (noise + sub * 0.8) * env;
            }
            soundBuffers.frankenstein = frankBuf;

            // 3. Psycho: High-Pitched Violin Screech Striking Motifs
            const psychoLen = sampleRate * 0.5;
            const psychoBuf = audioCtx.createBuffer(1, psychoLen, sampleRate);
            const psychoData = psychoBuf.getChannelData(0);
            for (let i = 0; i < psychoLen; i++) {
                const t = i / sampleRate;
                const cycle = t % 0.12;
                const env = Math.exp(-15 * cycle);
                const screech1 = Math.sin(2 * Math.PI * 2616.26 * t); // E7
                const screech2 = Math.sin(2 * Math.PI * 2793.83 * t); // F7
                psychoData[i] = (screech1 + screech2) * 0.4 * env;
            }
            soundBuffers.psycho = psychoBuf;

            // 4. Jaws: Two-Note Low Suspense Motif (D-Eb)
            const jawsLen = sampleRate * 0.7;
            const jawsBuf = audioCtx.createBuffer(1, jawsLen, sampleRate);
            const jawsData = jawsBuf.getChannelData(0);
            for (let i = 0; i < jawsLen; i++) {
                const t = i / sampleRate;
                let freq = 41.20; // E1
                let env = Math.exp(-8 * (t % 0.35));
                if (t >= 0.35) {
                    freq = 43.65; // F1
                }
                const wave = Math.sin(2 * Math.PI * freq * t) + 0.5 * Math.sin(4 * Math.PI * freq * t);
                jawsData[i] = wave * 0.7 * env;
            }
            soundBuffers.jaws = jawsBuf;

            // 5. Organ Chord Quick Trigger
            const organLen = sampleRate * 1.0;
            const organBuf = audioCtx.createBuffer(1, organLen, sampleRate);
            const organData = organBuf.getChannelData(0);
            for (let i = 0; i < organLen; i++) {
                const t = i / sampleRate;
                const env = Math.exp(-2.5 * t);
                const w = Math.sin(2 * Math.PI * 110 * t) + Math.sin(2 * Math.PI * 164.81 * t) + Math.sin(2 * Math.PI * 220 * t);
                organData[i] = w * 0.3 * env;
            }
            soundBuffers.organ = organBuf;

            // 6. Thunder Strike
            const thunLen = sampleRate * 0.9;
            const thunBuf = audioCtx.createBuffer(1, thunLen, sampleRate);
            const thunData = thunBuf.getChannelData(0);
            for (let i = 0; i < thunLen; i++) {
                const t = i / sampleRate;
                const env = Math.exp(-3.5 * t);
                thunData[i] = (Math.random() * 2 - 1) * env;
            }
            soundBuffers.thunder = thunBuf;
        }

        // Instant play helper with zero latency
        function playBuffer(key) {
            const ctx = getAudioContext();
            if (!soundBuffers[key]) prebakeSounds();
            if (soundBuffers[key]) {
                const source = ctx.createBufferSource();
                source.buffer = soundBuffers[key];
                source.connect(ctx.destination);
                source.start(0);
            }
        }

        const horrorData = {
            dracula: { quote: "I want to suck your blood...", playSound: () => playBuffer('dracula') },
            frankenstein: { quote: "IT'S ALIVE!", playSound: () => playBuffer('frankenstein') },
            psycho: { quote: "Eek!", playSound: () => playBuffer('psycho') },
            jaws: { quote: "I think you're going need a bigger boat!", playSound: () => playBuffer('jaws') }
        };

        function playOrganFx() { playBuffer('organ'); }
        function playThunderFx() { playBuffer('thunder'); }

        function handleHorrorClick(key) {
            getAudioContext();
            const isSilentMode = document.getElementById('silentTerrorCheck').checked;
            const data = horrorData[key];

            triggerScreenVibe();

            if (isSilentMode) {
                if (navigator.vibrate) navigator.vibrate(100);
                showAlert(data.quote);
            } else {
                data.playSound();
            }
        }

        let toastTimeout;
        function showAlert(msg) {
            const toast = document.getElementById('notifierToast');
            const msgEl = document.getElementById('notifierMessage');
            msgEl.textContent = msg;
            
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0px)';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(hideNotifier, 1200);
        }

        function hideNotifier() {
            const toast = document.getElementById('notifierToast');
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-16px)';
        }

        function triggerScreenVibe() {
            const container = document.querySelector('.phone-container');
            container.style.transform = 'translate3d(4px, 0, 0)';
            setTimeout(() => { container.style.transform = 'translate3d(-4px, 0, 0)'; }, 40);
            setTimeout(() => { container.style.transform = 'translate3d(0, 0, 0)'; }, 80);
        }

        // Fast Direct Pointer Handlers
        function bindFastClick(element, handler) {
            if (!element) return;
            element.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handler(e);
            }, { passive: false });
        }

        // App State Management
        let gameActive = false;
        let currentTarget = null;
        let score = 0;
        let timer = 30;
        let timerInterval = null;

        function toggleGameMode() {
            getAudioContext();
            const sbView = document.getElementById('soundboardView');
            const gView = document.getElementById('gameView');
            const modeBtnText = document.getElementById('modeBtnText');

            if (gView.classList.contains('hidden')) {
                gView.classList.remove('hidden');
                sbView.classList.add('hidden');
                modeBtnText.textContent = "Soundboard";
            } else {
                gView.classList.add('hidden');
                sbView.classList.remove('hidden');
                modeBtnText.textContent = "Play Game";
                endGame();
            }
        }

        function startHorrorGame() {
            getAudioContext();
            score = 0;
            timer = 30;
            gameActive = true;
            document.getElementById('gameScore').textContent = score;
            document.getElementById('gameTimer').textContent = `${timer}s`;
            document.getElementById('startGameBtn').textContent = "Restart Game";
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('gameTimer').textContent = `${timer}s`;
                if (timer <= 0) endGame();
            }, 1000);

            nextRound();
        }

        function nextRound() {
            const keys = Object.keys(horrorData);
            currentTarget = keys[Math.floor(Math.random() * keys.length)];
            
            const isAudioPrompt = Math.random() > 0.4;
            if (isAudioPrompt) {
                document.getElementById('targetQuote').textContent = "🔊 Listen carefully...";
                horrorData[currentTarget].playSound();
            } else {
                document.getElementById('targetQuote').textContent = `"${horrorData[currentTarget].quote}"`;
            }
        }

        function makeGuess(key) {
            if (!gameActive) return;

            if (key === currentTarget) {
                score += 10;
                document.getElementById('gameScore').textContent = score;
                showAlert("CORRECT! +10 Pts");
                horrorData[key].playSound();
                if (gameActive) nextRound();
            } else {
                triggerScreenVibe();
                showAlert("WRONG MONSTER!");
            }
        }

        function endGame() {
            gameActive = false;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('targetQuote').textContent = `Game Over! Score: ${score}`;
            document.getElementById('startGameBtn').textContent = "Play Again";
        }

        // Setup All Event Listeners on Load
        document.addEventListener('DOMContentLoaded', () => {
            // Mode toggle
            bindFastClick(document.getElementById('modeToggleBtn'), toggleGameMode);
            
            // Monster buttons
            document.querySelectorAll('.monster-btn').forEach(btn => {
                bindFastClick(btn, () => handleHorrorClick(btn.dataset.monster));
            });

            // Ambient sound buttons
            bindFastClick(document.getElementById('organBtn'), playOrganFx);
            bindFastClick(document.getElementById('thunderBtn'), playThunderFx);

            // Game buttons
            bindFastClick(document.getElementById('startGameBtn'), startHorrorGame);
            document.querySelectorAll('.game-guess-btn').forEach(btn => {
                bindFastClick(btn, () => makeGuess(btn.dataset.guess));
            });

            // Toast close button
            bindFastClick(document.getElementById('closeNotifierBtn'), hideNotifier);

            // Unlock audio on first user touch anywhere
            window.addEventListener('pointerdown', () => getAudioContext(), { once: true });
        });

        // Clock Display
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clockDisplay').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
